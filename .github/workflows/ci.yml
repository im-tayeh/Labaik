name: CI

# Run on every push to main and on every pull request targeting main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest   # a clean cloud machine GitHub gives us

    steps:
      - name: Checkout code
        uses: actions/checkout@v4          # pull our repo onto the runner

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4       # install the .NET 10 SDK
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Check for vulnerable packages
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.log
          ! grep -q "has the following vulnerable packages" audit.log

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore